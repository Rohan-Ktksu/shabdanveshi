name: Deploy frontend to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check API configuration and readiness
        env:
          API_URL: ${{ vars.VITE_API_URL }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          from urllib.parse import urlparse
          url=os.environ['API_URL'].rstrip('/')
          assert urlparse(url).scheme=='https','Set the VITE_API_URL repository variable to the deployed HTTPS API URL'
          with urllib.request.urlopen(url+'/api/health',timeout=90) as response:
              assert json.load(response)['status']=='ready','API is not ready'
          PY
      - uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: frontend
      - run: npm run build -- --base=/shabdanveshi/
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
