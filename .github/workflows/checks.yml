name: Project checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build -- --base=/shabdanveshi/
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      # Contract/filter fixtures do not download dictionaries or model weights.
      - run: python -m unittest backend.test_api backend.test_retrieval backend.test_bridge backend.test_performance -v

  runtime-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build runtime container
        run: docker build -t shabd-runtime .
      - name: Check searches with the new host's 2 GB memory budget
        run: |
          mkdir -p .temp/reference
          git show d5ab2f50e3fdf30f152b44798d457e3ec0a68dfe:backend/compact.py > .temp/reference/compact.py
          git show d5ab2f50e3fdf30f152b44798d457e3ec0a68dfe:backend/inference_worker.py > .temp/reference/inference_worker.py
          git show d5ab2f50e3fdf30f152b44798d457e3ec0a68dfe:backend/encoder.py > .temp/reference/encoder.py
          docker run -d --name shabd-reference --memory=2g --memory-swap=2g --cpus=1 \
            -p 127.0.0.1:8001:8000 \
            -v "$PWD/.temp/reference/compact.py:/app/backend/compact.py:ro" \
            -v "$PWD/.temp/reference/inference_worker.py:/app/backend/inference_worker.py:ro" \
            -v "$PWD/.temp/reference/encoder.py:/app/backend/encoder.py:ro" \
            -e ASSETS_URL=https://github.com/Rohan-Ktksu/shabdanveshi/releases/download/runtime-1/runtime-assets.tar.gz \
            -e ASSETS_SHA256=d91b32e8f816f3048ed31822bb017d3fb3f40902f207a30413841af33f6485af \
            shabd-runtime
          docker run -d --name shabd-memory --memory=2g --memory-swap=2g --cpus=1 \
            -p 127.0.0.1:8000:8000 \
            -e SHABD_MEMORY_DIAGNOSTICS=1 \
            -e ASSETS_URL=https://github.com/Rohan-Ktksu/shabdanveshi/releases/download/runtime-1/runtime-assets.tar.gz \
            -e ASSETS_SHA256=d91b32e8f816f3048ed31822bb017d3fb3f40902f207a30413841af33f6485af \
            shabd-runtime
          SHABD_REFERENCE_URL=http://127.0.0.1:8001 python -m backend.deployment_smoke
          docker exec shabd-memory cat /sys/fs/cgroup/memory.peak
          docker exec shabd-memory sh -c '! grep -Eq "^oom_kill [1-9]" /sys/fs/cgroup/memory.events'
      - name: Container logs
        if: always()
        run: |
          docker logs shabd-memory || true
          docker exec shabd-memory cat /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.peak || true
          docker logs shabd-reference || true
      - name: Remove test container
        if: always()
        run: docker rm -f shabd-memory shabd-reference || true
