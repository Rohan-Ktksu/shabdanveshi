<div id="shabd-design">
<style>
#shabd-design{font-family:Arial,'Nirmala UI',sans-serif}#shabd-design *{box-sizing:border-box}
#shabd-design .app{--bg:light-dark(#faf9f4,#19251f);--fg:light-dark(#243a2b,#edf4ed);--soft:light-dark(#eeeee4,#2c3b31);--line:light-dark(#dce1d4,#46564b);--ac:light-dark(#38654a,#b3dbbc);--on:light-dark(#fff,#18281c);background:var(--bg);color:var(--fg);min-height:720px;border:1px solid var(--line);border-radius:18px;position:relative;overflow:hidden}
#shabd-design button,#shabd-design textarea,#shabd-design select{font:inherit;color:inherit}#shabd-design button{background:none;border:0;border-radius:9px;padding:10px 12px;cursor:pointer}#shabd-design button:hover{background:var(--soft)}#shabd-design button:focus-visible{outline:2px solid var(--ac)}
#shabd-design header{padding:22px 27px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}#shabd-design .brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700}#shabd-design .mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--ac);color:var(--on);font-size:25px}#shabd-design nav{display:flex;gap:5px;font-size:13px}#shabd-design nav button{display:flex;align-items:center;gap:6px}
#shabd-design main{padding:36px 30px 25px;max-width:780px;margin:auto}#shabd-design .eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--ac);font-weight:700}#shabd-design h1{font:400 44px/1.15 Georgia,'Nirmala UI',serif;letter-spacing:-1px;margin:15px 0}#shabd-design .intro p{font-size:14px;line-height:1.7;opacity:.8;margin-bottom:20px}#shabd-design .examples{display:flex;gap:8px;flex-wrap:wrap;margin:19px 0 25px}#shabd-design .examples button{border:1px solid var(--line);border-radius:25px;font-size:12px}
#shabd-design .user{margin-left:auto;padding:13px 17px;width:fit-content;max-width:95%;border-radius:16px 16px 3px 16px;background:var(--soft);font-size:14px;line-height:1.6}#shabd-design .answer{display:flex;gap:13px;margin:23px 0}#shabd-design .sig{color:var(--ac);font-size:25px}#shabd-design .result{flex:1}#shabd-design .result>p{font-size:13px;margin:0 0 12px}#shabd-design h3{font:400 28px Georgia,'Nirmala UI',serif;margin:0 0 10px}#shabd-design h3 small{font:12px Arial;margin-left:12px;opacity:.6}#shabd-design .definition{padding-bottom:17px;border-bottom:1px solid var(--line)}#shabd-design .definition p{font-size:14px;line-height:1.6;margin:0}#shabd-design .related{font-size:12px;display:flex;gap:8px;margin-top:12px}#shabd-design .related span{background:var(--soft);padding:7px 10px;border-radius:7px}
#shabd-design .compose{background:light-dark(#fff,#223027);border:1px solid var(--line);padding:16px;border-radius:17px;box-shadow:0 5px 20px #00000005}#shabd-design textarea{width:100%;resize:vertical;min-height:50px;background:transparent;border:0;font-size:15px;line-height:1.6}#shabd-design .tools{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;flex-wrap:wrap}#shabd-design .send{background:var(--ac);color:var(--on);display:flex;gap:8px;align-items:center}#shabd-design .send:hover{background:var(--ac);opacity:.85}#shabd-design .note{font-size:11px;text-align:center;opacity:.65;margin:12px 0}#shabd-design aside{display:none}#shabd-design [hidden]{display:none!important}
#shabd-design .panel{font-size:15px;line-height:1.8;padding:22px 0}#shabd-design .panel h2{font:32px Georgia,'Nirmala UI',serif}#shabd-design .panel label{display:block;margin:18px 0}#shabd-design select{background:var(--soft);padding:9px;border:1px solid var(--line);border-radius:6px;max-width:100%}#shabd-design .profiles{display:flex;gap:20px;flex-wrap:wrap;font-size:13px}#shabd-design .profiles span{display:flex;gap:7px;align-items:center}
#shabd-design .overlay{position:absolute;inset:0;background:light-dark(#f5f4eeed,#17251ff2);z-index:5;display:grid;place-items:center;padding:24px}#shabd-design .welcome{width:min(450px,100%);padding:35px 25px;border:1px solid var(--line);border-radius:23px;text-align:center;background:var(--bg);box-shadow:0 20px 50px #00000012}#shabd-design .welcome .mark{margin:auto;width:54px;height:54px;font-size:32px}#shabd-design .welcome h2{font:30px/1.4 Georgia,'Nirmala UI',serif}#shabd-design .welcome p{font-size:14px;line-height:1.7}#shabd-design .choices{display:flex;gap:12px;margin:24px 0}#shabd-design .choices button{flex:1;padding:22px 8px;background:var(--soft);font-size:20px;border:1px solid var(--line)}#shabd-design .choices small{display:block;font-size:12px;margin-top:9px}
#shabd-design .studio{--bg:light-dark(#f8f9fd,#181c2c);--fg:light-dark(#26324e,#eef0ff);--soft:light-dark(#ecedf8,#2b2e48);--line:light-dark(#dcdeed,#454a69);--ac:light-dark(#5e52ab,#c9bffc);--on:light-dark(#fff,#241d49)}#shabd-design .studio .shell{display:grid;grid-template-columns:190px 1fr}#shabd-design .studio aside{display:block;background:var(--soft);border-right:1px solid var(--line);padding:25px 18px}#shabd-design aside button{display:block;font-size:13px;width:100%;text-align:left;margin:7px 0}#shabd-design aside p{font-size:11px;letter-spacing:1.6px;margin:35px 0 17px;opacity:.65}#shabd-design .studio h1{font:600 33px/1.2 Arial,'Nirmala UI',sans-serif}#shabd-design .studio main{padding:30px 24px}#shabd-design .studio .definition{background:var(--soft);padding:16px;border:0;border-radius:12px}
#shabd-design .journal{--bg:light-dark(#fff8ef,#281d18);--fg:light-dark(#4b2c22,#fbe9da);--soft:light-dark(#f2e6d9,#3e2e25);--line:light-dark(#e1cdbb,#624d3c);--ac:light-dark(#a04b2f,#edb18d);--on:light-dark(#fff,#361c10)}#shabd-design .journal main.chat{max-width:none;display:grid;grid-template-columns:1fr 1.2fr;gap:35px;padding:45px 35px}#shabd-design .journal .intro{border-right:1px solid var(--line);padding-right:25px}#shabd-design .journal h1{font-size:49px}#shabd-design .journal .examples{display:grid;margin-top:35px}#shabd-design .journal .examples button{border:0;border-bottom:1px solid var(--line);border-radius:0;text-align:left;padding:15px 0}#shabd-design .journal .compose{border-radius:3px;box-shadow:none}
@media(max-width:650px){#shabd-design .app{min-height:850px}#shabd-design header{padding:18px 15px}#shabd-design .brand{font-size:16px}#shabd-design nav{gap:0}#shabd-design nav button{padding:8px}#shabd-design main{padding:28px 18px}#shabd-design h1{font-size:35px}#shabd-design .studio .shell{display:block}#shabd-design .studio aside{display:none}#shabd-design .journal main.chat{display:block;padding:27px 21px}#shabd-design .journal .intro{border:0;padding:0}#shabd-design .journal h1{font-size:36px}#shabd-design .journal .examples{display:none}}
</style>
<style>
#shabd-design .about-expanded{padding-top:10px}#shabd-design .about-expanded h2{font-size:39px;line-height:1.2;letter-spacing:-.8px}#shabd-design .about-lead{font-size:16px;line-height:1.85}#shabd-design .build-status{font-size:12px;color:var(--ac);padding:12px 0;border-bottom:1px solid var(--line)}#shabd-design .journey-section{margin:34px 0}#shabd-design .journey-section>h3{font-size:24px;margin-bottom:16px}#shabd-design .journey{padding-left:24px}#shabd-design .journey li{padding:0 0 14px 7px}#shabd-design .journey p{margin:5px 0 0}#shabd-design .logic{padding-left:23px}#shabd-design .logic li{padding:0 0 12px 6px}#shabd-design .stack{margin:18px 0}#shabd-design .stack>div{display:grid;grid-template-columns:170px 1fr;gap:20px;padding:17px 0;border-bottom:1px solid var(--line)}#shabd-design dt{font-weight:600}#shabd-design dd{margin:0}#shabd-design .creator{display:flex;gap:15px;align-items:center;padding:15px 0}#shabd-design .creator h3{font-size:25px}#shabd-design .creator p{margin:0;font-size:13px}#shabd-design .creator-initial{display:grid;place-items:center;width:54px;height:54px;background:var(--soft);border-radius:50%;color:var(--ac)}#shabd-design .details>div{display:grid;grid-template-columns:155px 1fr;gap:15px;padding:8px 0;font-size:14px}#shabd-design .profile-actions{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:25px 0}#shabd-design .profile-actions a{display:flex;align-items:center;gap:8px;background:var(--ac);color:var(--on);padding:11px 16px;border-radius:8px;text-decoration:none;font-size:14px}#shabd-design .pending-repo{display:flex;align-items:center;gap:8px;font-size:12px;opacity:.75}#shabd-design .secondary-word{margin-top:17px}#shabd-design .secondary-word h3{font-size:22px}@media(max-width:550px){#shabd-design .stack>div{grid-template-columns:1fr;gap:6px}#shabd-design .details>div{grid-template-columns:1fr;gap:2px}#shabd-design .about-expanded h2{font-size:31px}}
</style>
<div class="viz-carousel" aria-label="ShabdAnveshi interface concepts">
<section data-variant="Quiet Conversation"><div class="app quiet" aria-label="Quiet Conversation"></div></section>
<section data-variant="Word Studio" hidden><div class="app studio" aria-label="Word Studio"></div></section>
<section data-variant="The Word Journal" hidden><div class="app journal" aria-label="The Word Journal"></div></section>
</div>
<script>
(()=>{
const root=document.getElementById('shabd-design');
const words={en:{about:'About',title:'You know the feeling.<br>Let’s find the word.',sub:'Describe what you mean in Hindi or English. Find the word that fits.',eyebrow:'A thought away from the right word',query:'What do you call someone who loves books?',lead:'The word you may be looking for is',word:'Bibliophile',pos:'noun',meaning:'A person who loves or collects books.',related:['Book lover','Bookworm'],placeholder:'Describe the word on your mind…',send:'Find my word',clue:'Add a clue',settings:'Settings',why:'Why ShabdAnveshi?',story:'Sometimes we remember the meaning, the feeling or the situation, but the word itself escapes us. ShabdAnveshi began with that familiar moment: helping people turn a thought into the expression they need.',project:'An NLP project exploring similar word prediction and contextual word retrieval in English and Hindi.',back:'Back to chat'},hi:{about:'परिचय',title:'भाव याद है।<br>आइए, शब्द खोजें।',sub:'हिंदी या अंग्रेज़ी में अपना विचार बताइए। हम सही शब्द खोजने में मदद करेंगे।',eyebrow:'सोच से सही शब्द तक',query:'किताबों से प्यार करने वाले व्यक्ति को क्या कहते हैं?',lead:'आप शायद इस शब्द को खोज रहे हैं',word:'पुस्तकप्रेमी',pos:'संज्ञा',meaning:'वह व्यक्ति जिसे पुस्तकें पढ़ने या संग्रह करने का शौक हो।',related:['पुस्तक प्रेमी','पाठक'],placeholder:'जिस शब्द की तलाश है, उसका अर्थ बताइए…',send:'शब्द खोजें',clue:'संकेत जोड़ें',settings:'सेटिंग्स',why:'शब्दान्वेषी क्यों?',story:'कभी किसी शब्द का अर्थ, भावना या उससे जुड़ी परिस्थिति याद रहती है, लेकिन शब्द याद नहीं आता। शब्दान्वेषी इसी अनुभव से शुरू हुआ: आपके विचार के लिए सही अभिव्यक्ति खोजने में मदद करना।',project:'हिंदी और अंग्रेज़ी में संदर्भ के आधार पर शब्द खोजने और समान शब्दों का अनुमान लगाने वाला NLP प्रोजेक्ट।',back:'चैट पर लौटें'}};
root.querySelectorAll('.app').forEach(app=>{
let lang='en',page='about',modal=false;
const ic=n=>'<i data-lucide="'+n+'" aria-hidden="true"></i>';
function render(){const t=words[lang];app.lang=lang;
app.innerHTML=`<header><div class="brand"><span class="mark">श</span>ShabdAnveshi</div><nav aria-label="Navigation"><button data-act="about">${t.about}</button><button data-act="language" aria-label="Change language">${ic('languages')} ${lang==='en'?'EN':'हिं'}</button><button data-act="settings" aria-label="${t.settings}">${ic('settings-2')}</button></nav></header><div class="shell"><aside><button data-act="chat">+ ${lang==='en'?'New search':'नई खोज'}</button><p>${lang==='en'?'YOUR WORD SPACE':'आपका शब्द संसार'}</p><button data-act="chat">${lang==='en'?'Find a word':'शब्द खोजें'}</button><button data-act="language">English / हिंदी</button><button data-act="about">${t.about}</button></aside><main class="${page}">${page==='chat'?`<div class="intro"><div class="eyebrow">${t.eyebrow}</div><h1>${t.title}</h1><p>${t.sub}</p><div class="examples"><button data-act="example">${lang==='en'?'A person who loves books':'किताबों से प्यार करने वाला व्यक्ति'} ↗</button><button data-act="example">${lang==='en'?'A bittersweet memory':'खुशी और दुख से जुड़ी याद'} ↗</button></div></div><div class="conversation"><div class="user">${t.query}</div><div class="answer"><div class="sig">श</div><div class="result"><p>${t.lead}</p><div class="definition"><h3>${t.word}<small>${t.pos}</small></h3><p>${t.meaning}</p></div><div class="related">${t.related.map(w=>'<span>'+w+'</span>').join('')}</div></div></div><div class="compose"><textarea aria-label="${t.placeholder}" placeholder="${t.placeholder}"></textarea><div class="tools"><button data-act="clues">${ic('sliders-horizontal')} ${t.clue}</button><span>${lang==='en'?'English results':'हिंदी परिणाम'}</span><button class="send" data-act="send">${t.send} ${ic('arrow-up')}</button></div><div class="clues" hidden><label>${lang==='en'?'Starts with':'पहला अक्षर'} <input size="3" maxlength="3"></label></div></div><p class="note" aria-live="polite">${lang==='en'?'Design preview · example conversation':'डिज़ाइन पूर्वावलोकन · उदाहरण बातचीत'}</p></div>`:page==='about'?`<article class="panel"><div class="eyebrow">${lang==='en'?'THE IDEA BEHIND THE WORDS':'शब्दों के पीछे का विचार'}</div><h2>${t.why}</h2><p>${t.story}</p><p>${t.project}</p><h3>Gorumutchu Rohan Sai</h3><p>CSIT A · R24EJ042</p><div class="profiles"><span>${ic('github')} GitHub · profile URL pending</span><span>${ic('linkedin')} LinkedIn · profile URL pending</span></div><p><button data-act="chat">← ${t.back}</button></p></article>`:`<section class="panel"><h2>${t.settings}</h2><label>${lang==='en'?'Website language':'वेबसाइट की भाषा'} <select data-setting="lang"><option value="en" ${lang==='en'?'selected':''}>English</option><option value="hi" ${lang==='hi'?'selected':''}>हिंदी</option></select></label><label>${lang==='en'?'Find words in':'शब्द किस भाषा में खोजें'} <select><option>English</option><option ${lang==='hi'?'selected':''}>हिंदी</option><option>Both / दोनों</option></select></label><label><input type="checkbox" checked> ${lang==='en'?'Show definitions':'अर्थ दिखाएँ'}</label><button data-act="language">${lang==='en'?'Preview first-visit language selection':'पहली बार भाषा चयन देखें'}</button><p><button data-act="chat">← ${t.back}</button></p></section>`}</main></div><div class="overlay" ${modal?'':'hidden'}><section class="welcome" role="dialog" aria-label="Choose your language"><div class="mark">श</div><h2>Words begin with you.<br>आपकी भाषा, आपके शब्द।</h2><p>Choose your language to get started.<br>शुरू करने के लिए भाषा चुनें।</p><div class="choices"><button data-lang="en">English<small>Continue →</small></button><button data-lang="hi">हिंदी<small>आगे बढ़ें →</small></button></div><p>You can change this anytime.<br>आप इसे कभी भी बदल सकते हैं।</p></section></div>`;
if(page==='about'){
const en=lang==='en';
const section=(title,body)=>`<section class="journey-section"><h3>${title}</h3>${body}</section>`;
const stack=[['React + TypeScript',en?'A responsive chat interface with typed components and bilingual labels.':'द्विभाषी लेबल और स्पष्ट कंपोनेंट वाला चैट इंटरफ़ेस।'],['Python + FastAPI',en?'An API that accepts descriptions and returns ranked word suggestions.':'विवरण लेकर क्रमबद्ध शब्द सुझाव लौटाने वाला API।'],['Sentence Transformers',en?'A multilingual embedding model to compare the meaning of descriptions and dictionary entries. The model will be selected through testing.':'विवरण और शब्दकोश के अर्थ की तुलना के लिए बहुभाषी मॉडल। मॉडल का चयन परीक्षण के आधार पर होगा।'],['scikit-learn',en?'TF-IDF and cosine similarity provide a keyword baseline to compare against semantic retrieval.':'TF-IDF और cosine similarity से कीवर्ड मिलान, जिसकी तुलना अर्थ आधारित खोज से होगी।'],['NLTK + WordNet',en?'English word senses, definitions and synonyms. Hindi needs a separate lexical resource with suitable usage rights; English WordNet alone is insufficient.':'अंग्रेज़ी शब्दार्थ, परिभाषाएँ और समानार्थी शब्द। हिंदी के लिए उपयुक्त उपयोग अधिकार वाला अलग शब्द-संसाधन आवश्यक होगा।'],['Vite + GitHub Actions',en?'Build and publish the React frontend. The Python service is planned for Render, connected to the same repository.':'React वेबसाइट का निर्माण और प्रकाशन। Python सेवा उसी रिपॉज़िटरी से जुड़े Render पर चलाने की योजना है।']];
app.querySelector('main').innerHTML=`<article class="panel about-expanded"><div class="eyebrow">${en?'THE STORY OF SHABDANVESHI':'शब्दान्वेषी की कहानी'}</div><h2>${en?'The meaning is there.<br>The word is somewhere.':'अर्थ याद है।<br>शब्द कहीं खो गया है।'}</h2><p class="about-lead">${t.story}</p><div class="build-status">${en?'Current stage · Interface design approved; website implementation next.':'वर्तमान चरण · इंटरफ़ेस डिज़ाइन चुना गया है; अब वेबसाइट बनाई जाएगी।'}</div>${section(en?'From an assignment to a useful idea':'असाइनमेंट से एक उपयोगी विचार तक',`<ol class="journey"><li><strong>${en?'The starting point':'शुरुआत'}</strong><p>${en?'The Natural Language Processing assignment on Similar Word Prediction became a Tip of the Tongue Finder: describe a forgotten word instead of needing to know its spelling.':'Similar Word Prediction के NLP असाइनमेंट से Tip of the Tongue Finder का विचार बना: भूले हुए शब्द की वर्तनी के बजाय उसका अर्थ बताकर उसे खोजें।'}</p></li><li><strong>${en?'The report prototype':'रिपोर्ट का प्रोटोटाइप'}</strong><p>${en?'The earlier Python prototype explored WordNet definitions, semantic matching and TF-IDF ranking. The report presented code and notebook outputs to explain the approach.':'पहले Python प्रोटोटाइप में WordNet, अर्थ आधारित मिलान और TF-IDF रैंकिंग का प्रयोग किया गया। रिपोर्ट में कोड और नोटबुक आउटपुट से इसकी प्रक्रिया समझाई गई।'}</p></li><li><strong>${en?'A conversation in two languages':'दो भाषाओं में बातचीत'}</strong><p>${en?'The next step is a React website with a Python backend, so users can describe a word in Hindi or English, add clues and explore suggestions through a chat interface.':'अगला चरण React वेबसाइट और Python बैकएंड है। उपयोगकर्ता हिंदी या अंग्रेज़ी में विवरण देकर, संकेत जोड़कर चैट में शब्द खोज सकेंगे।'}</p></li><li><strong>${en?'Test, learn and publish':'परीक्षण और प्रकाशन'}</strong><p>${en?'We will check vocabulary coverage, test descriptions with known answers and measure top-1 and top-5 retrieval. The repository and
