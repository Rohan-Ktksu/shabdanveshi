<text x="525" y="83.5"><tspan x="525" dy="0">Description and</tspan><tspan x="525" dy="29">optional clues</tspan></text>
<path class="node" d="M525 175L655 225L525 275L395 225Z"/>
<text x="525" y="233"><tspan x="525" dy="0">Hindi script?</tspan></text>
<text x="318" y="209" class="branch"><tspan x="318" dy="0">Yes</tspan></text>
<text x="727" y="209" class="branch"><tspan x="727" dy="0">No</tspan></text>
<rect class="node" x="75" y="320" width="350" height="85" rx="12"/>
<text x="250" y="356"><tspan x="250" dy="0">Local OPUS-MT</tspan><tspan x="250" dy="29">Hindi → English translation</tspan></text>
<rect class="node" x="340" y="470" width="370" height="70" rx="12"/>
<text x="525" y="513"><tspan x="525" dy="0">Query text</tspan></text>
<rect class="node" x="75" y="610" width="350" height="85" rx="12"/>
<text x="250" y="646"><tspan x="250" dy="0">Multilingual E5</tspan><tspan x="250" dy="29">Query embedding</tspan></text>
<rect class="node" x="625" y="610" width="350" height="85" rx="12"/>
<text x="800" y="646"><tspan x="800" dy="0">TF-IDF</tspan><tspan x="800" dy="29">Query terms</tspan></text>
<rect class="node" x="75" y="740" width="350" height="85" rx="12"/>
<text x="250" y="776"><tspan x="250" dy="0">Compare dictionary</tspan><tspan x="250" dy="29">vectors</tspan></text>
<rect class="node" x="625" y="740" width="350" height="85" rx="12"/>
<text x="800" y="776"><tspan x="800" dy="0">Read precomputed</tspan><tspan x="800" dy="29">postings</tspan></text>
