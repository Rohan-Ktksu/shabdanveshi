<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="1335" viewBox="0 0 1050 1335" role="img" aria-labelledby="title desc">
<title id="title">ShabdAnveshi search pipeline</title>
<desc id="desc">Descriptions and optional clues enter the pipeline. Hindi descriptions are translated locally with OPUS-MT; other descriptions proceed directly. E5 embeddings and TF-IDF scores are combined, followed by an exact-gloss WordNet bridge, filtering, and dictionary results.</desc>
