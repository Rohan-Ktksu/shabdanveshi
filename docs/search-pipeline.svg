<rect width="1050" height="1335" rx="16" fill="#f8faf7"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17271e;font-size:23px;text-anchor:middle} .edge{fill:none;stroke:#53675b;stroke-width:2.5;marker-end:url(#arrow)} .node{fill:#fff;stroke:#668573;stroke-width:2} .branch{font-size:20px;fill:#425e4b}</style>
