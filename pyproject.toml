[project]
name = "shabdanveshi-api"
version = "0.3.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.3",
  "uvicorn==0.54.0",
  "numpy==2.5.4",
  "onnxruntime==1.31.0",
  "tokenizers==0.23.3",
  "sentencepiece==0.2.1",
  "regex==2026.9.29",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "backend.main:app"

[tool.vercel.scripts]
build = "python -m backend.vercel_build"
